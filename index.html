<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EOH Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
height:100vh;
overflow:hidden;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 30px;
border-bottom:1px solid rgba(212,175,55,0.2);
}

header h1{
color:#d4af37;
}

header p{
font-size:12px;
color:#aaa;
}

/* BUTTON */
button{
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
padding:10px 15px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

/* MAIN */
main{
padding:20px 30px;
height:calc(100vh - 80px);
overflow:auto;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

/* CARD */
.card{
background:#111;
padding:20px;
border-radius:14px;
border:1px solid rgba(212,175,55,0.2);
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
border-color:#d4af37;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:#111;
padding:20px;
border-radius:14px;
width:320px;
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
background:#1a1a1a;
color:white;
}

</style>

</head>

<body>

<header>

<div>
<h1>EOH Studio</h1>
<p>Turn your writing into visuals.</p>
</div>

<button onclick="openModal()">+ Create Project</button>

</header>

<main>

<h2>Dashboard</h2>

<div class="grid" id="projectGrid">

</div>

</main>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-box">

<h3>Create Project</h3>

<input id="name" placeholder="Project Name">

<select id="style">
<option>Anime</option>
<option>Fantasy</option>
<option>Cyberpunk</option>
</select>

<select id="world">
<option>Fictional</option>
<option>Sci-Fi</option>
<option>Historical</option>
</select>

<button onclick="createProject()">Create</button>

</div>

</div>

<script>

/* CORE STORAGE */
let projects = JSON.parse(localStorage.getItem("eoh_projects")) || [];

/* OPEN MODAL */
function openModal(){
document.getElementById("modal").style.display="flex";
}

/* CLOSE */
window.onclick = function(e){
if(e.target.id==="modal"){
document.getElementById("modal").style.display="none";
}
}

/* CREATE PROJECT */
function createProject(){

let name = document.getElementById("name").value;
let style = document.getElementById("style").value;
let world = document.getElementById("world").value;

if(!name) return;

let project = {
id: Date.now(),
name,
style,
world,
story:"",
characters:[],
worldData:{}
};

projects.push(project);

localStorage.setItem("eoh_projects",JSON.stringify(projects));

render();

document.getElementById("modal").style.display="none";

}

/* RENDER */
function render(){

let grid = document.getElementById("projectGrid");
grid.innerHTML="";

projects.forEach(p=>{

let div = document.createElement("div");
div.className="card";

div.innerHTML = `
<h3>${p.name}</h3>
<p>${p.style} / ${p.world}</p>
`;

div.onclick = ()=>{

localStorage.setItem("current_project",JSON.stringify(p));

window.location.href="pages/project.html";

};

grid.appendChild(div);

});

}

render();

</script>

</body>
</html>
