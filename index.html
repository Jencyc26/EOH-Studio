<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EOH Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
overflow:hidden;
}

/* LAYOUT */
.app-layout{display:flex;height:100vh;}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0d0d0d;
border-right:1px solid rgba(212,175,55,0.2);
padding:20px;
}

/* MAIN */
.main-content{
flex:1;
padding:30px;
overflow-y:auto;
}

/* HEADER */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.primary-btn{
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

/* GRID */
.project-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

/* CARD */
.project-card{
background:#111;
padding:20px;
border-radius:16px;
border:1px solid rgba(212,175,55,0.2);
cursor:pointer;
}

/* MODAL */
.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:#111;
padding:25px;
border-radius:16px;
width:350px;
}

.modal-box input,
.modal-box select{
width:100%;
padding:10px;
margin-bottom:10px;
background:#1a1a1a;
border:none;
color:white;
}

.create-project-btn{
width:100%;
padding:10px;
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app-layout">

<!-- SIDEBAR -->
<aside class="sidebar">
<h2>EOH Studio</h2>
<p>Turn ideas into visuals</p>
</aside>

<!-- MAIN -->
<main class="main-content">

<div class="topbar">
<div>
<h2>Dashboard / டாஷ்போர்டு</h2>
<p>Create cinematic projects</p>
</div>

<button class="primary-btn" id="openProjectModal">
+ Create Project
</button>
</div>

<section class="project-grid">

<div class="project-card">
<h3>+ New Project</h3>
<p>Start your story</p>
</div>

</section>

</main>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="projectModal">

<div class="modal-box">

<h3>Create Project / திட்டம்</h3>

<input id="projectName" placeholder="Project Name">

<select id="projectStyle">
<option>Anime Style</option>
<option>Cyberpunk</option>
<option>Fantasy</option>
</select>

<select id="projectWorld">
<option>Fictional</option>
<option>Sci-Fi</option>
<option>Historical</option>
</select>

<button class="create-project-btn" id="createProject">
Create
</button>

</div>

</div>

<script>

const modal = document.getElementById("projectModal");
const openBtn = document.getElementById("openProjectModal");
const createBtn = document.getElementById("createProject");
const grid = document.querySelector(".project-grid");

let projects = JSON.parse(localStorage.getItem("eoh-projects")) || [];

/* RENDER */
function render(){
document.querySelectorAll(".generated").forEach(e=>e.remove());

projects.forEach(p=>{
const div = document.createElement("div");
div.className="project-card generated";
div.innerHTML = `<h3>${p.name}</h3><p>${p.style} / ${p.world}</p>`;

div.onclick = ()=>{
localStorage.setItem("current-project",JSON.stringify(p));
window.location.href="pages/project.html";
};

grid.appendChild(div);
});
}

render();

/* OPEN MODAL */
openBtn.onclick=()=>modal.style.display="flex";

/* CREATE */
createBtn.onclick=()=>{

const name = document.getElementById("projectName").value;
const style = document.getElementById("projectStyle").value;
const world = document.getElementById("projectWorld").value;

if(!name) return alert("Enter name");

projects.push({
name,
style,
world,
story:"",
characters:[]
});

localStorage.setItem("eoh-projects",JSON.stringify(projects));

render();
modal.style.display="none";
};

</script>

</body>
</html>
