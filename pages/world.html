<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH World Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#050505;
color:white;
padding:30px;
margin:0;
}

.container{
max-width:1450px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:400px 1fr;
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid rgba(212,175,55,.15);
}

input,textarea,select{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
font-family:Poppins;
}

textarea{
height:120px;
resize:none;
}

button{
padding:14px 18px;
background:#d4af37;
border:none;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

.world-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:18px;
}

.world-box{
background:#1a1a1a;
padding:20px;
border-radius:18px;
}

.world-avatar{
width:100px;
height:100px;
border-radius:50%;
background:#d4af37;
margin:auto;
margin-bottom:16px;
}

.tag{
display:inline-block;
padding:6px 12px;
background:#222;
color:#d4af37;
border-radius:20px;
font-size:12px;
margin-bottom:10px;
}

.actions{
margin-top:15px;
display:flex;
gap:8px;
justify-content:center;
}

h1{
color:#d4af37;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 World Engine</h1>

<div class="grid">

<!-- LEFT -->

<div class="card">

<input id="worldName" placeholder="World Name">

<select id="animeStyle">
<option>Fantasy Anime</option>
<option>Dark Fantasy</option>
<option>Cyberpunk</option>
<option>Realistic</option>
<option>Ghibli Inspired</option>
</select>

<select id="worldType">
<option>Fictional</option>
<option>Non Fictional</option>
</select>

<input id="country" placeholder="Country Inspiration">

<input id="timeline" placeholder="Timeline / Era">

<input id="colorCode" placeholder="Color Identity">

<textarea id="culture" placeholder="Culture Description"></textarea>

<textarea id="architecture" placeholder="Architecture / Environment"></textarea>

<button onclick="saveWorld()">
Save World
</button>

</div>

<!-- RIGHT -->

<div class="card">

<div id="worldList" class="world-grid"></div>

</div>

</div>

</div>

<script>

let worlds =
JSON.parse(localStorage.getItem("worlds")) || [];

/* SAVE */

function saveWorld(){

const world = {

name:worldName.value,
style:animeStyle.value,
type:worldType.value,
country:country.value,
timeline:timeline.value,
color:colorCode.value,
culture:culture.value,
architecture:architecture.value

};

worlds.push(world);

localStorage.setItem(
"worlds",
JSON.stringify(worlds)
);

renderWorlds();

}

/* DELETE */

function deleteWorld(i){

worlds.splice(i,1);

localStorage.setItem(
"worlds",
JSON.stringify(worlds)
);

renderWorlds();

}

/* RENDER */

function renderWorlds(){

const list =
document.getElementById("worldList");

list.innerHTML="";

worlds.forEach((world,i)=>{

list.innerHTML += `

<div class="world-box">

<div class="world-avatar"></div>

<div class="tag">
${world.style}
</div>

<h3 style="color:#d4af37;">
${world.name}
</h3>

<p>${world.country}</p>

<p style="
margin-top:10px;
font-size:13px;
color:#888;
">
${world.timeline}
</p>

<p style="
margin-top:10px;
font-size:13px;
color:#aaa;
">
${world.culture}
</p>

<div class="actions">

<button onclick="deleteWorld(${i})">
Delete
</button>

</div>

</div>

`;

});

}

renderWorlds();

</script>

<script src="../js/app.js"></script>

</body>
</html>
