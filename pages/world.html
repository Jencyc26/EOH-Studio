<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EOH World Engine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
}

/* MAIN */

.container{
padding:35px;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
flex-wrap:wrap;
gap:15px;
}

.title h1{
font-size:38px;
color:#d4af37;
margin-bottom:8px;
}

.title p{
color:#888;
}

/* BUTTONS */

.button-group{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.btn{
padding:14px 20px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.gold-btn{
background:linear-gradient(145deg,#d4af37,#f1cc56);
color:black;
}

.dark-btn{
background:#151515;
color:#d4af37;
border:1px solid rgba(212,175,55,0.2);
}

.btn:hover{
transform:translateY(-3px);
}

/* GRID */

.world-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

/* CARD */

.world-card{
background:#111;
padding:26px;
border-radius:22px;
border:1px solid rgba(212,175,55,0.15);
position:relative;
transition:0.3s;
}

.world-card:hover{
transform:translateY(-5px);
border-color:#d4af37;
}

.world-card h2{
color:#d4af37;
margin-bottom:12px;
}

.world-card p{
color:#999;
line-height:1.8;
font-size:14px;
white-space:pre-wrap;
}

/* TAG */

.world-tag{
display:inline-block;
margin-top:16px;
padding:8px 14px;
border-radius:30px;
background:#1b1b1b;
color:#d4af37;
font-size:12px;
}

/* ACTIONS */

.card-actions{
position:absolute;
top:18px;
right:18px;
display:flex;
gap:8px;
}

.action-btn{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
}

.delete-btn{
background:#2a0000;
color:#ff7070;
}

.edit-btn{
background:#111827;
color:#7dd3fc;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-box{
width:650px;
max-height:90vh;
overflow-y:auto;
background:#111;
padding:30px;
border-radius:24px;
border:1px solid rgba(212,175,55,0.2);
}

.modal-box h2{
color:#d4af37;
margin-bottom:20px;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
width:100%;
padding:14px;
margin-bottom:14px;
border:none;
border-radius:12px;
background:#1b1b1b;
color:white;
font-family:'Poppins',sans-serif;
}

textarea{
resize:none;
height:110px;
}

/* FOOTER */

.footer{
margin-top:50px;
text-align:center;
color:#666;
font-size:13px;
}

@media(max-width:700px){

.container{
padding:20px;
}

.modal-box{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<!-- TOPBAR -->

<div class="topbar">

<div class="title">

<h1>
🌍 World Engine
</h1>

<p>
Store world continuity, culture and environmental logic
</p>

</div>

<div class="button-group">

<button class="btn dark-btn"
onclick="goBack()">

← Workspace

</button>

<button class="btn dark-btn"
id="undoBtn">

↩ Undo Delete

</button>

<button class="btn gold-btn"
id="openModal">

+ Create World

</button>

</div>

</div>

<!-- WORLD GRID -->

<section class="world-grid"
id="worldGrid">

</section>

<div class="footer">
EOH World Engine © 2026
</div>

</div>

<!-- MODAL -->

<div class="modal"
id="modal">

<div class="modal-box">

<h2>Create World</h2>

<input
type="text"
id="worldName"
placeholder="World / Country Name"
>

<select id="worldType">

<option>Fictional</option>
<option>Non Fictional</option>
<option>Sci-Fi</option>
<option>Historical</option>
<option>Fantasy</option>

</select>

<input
type="text"
id="worldTimeline"
placeholder="Timeline / Era"
>

<input
type="text"
id="worldCulture"
placeholder="Culture / Society"
>

<input
type="text"
id="worldArchitecture"
placeholder="Architecture Style"
>

<input
type="text"
id="worldFashion"
placeholder="Fashion Style"
>

<input
type="text"
id="worldTechnology"
placeholder="Technology Level"
>

<input
type="text"
id="worldWeather"
placeholder="Weather / Climate"
>

<input
type="text"
id="worldPalette"
placeholder="Color Palette"
>

<textarea
id="worldEnvironment"
placeholder="Environment Details"
></textarea>

<textarea
id="worldRules"
placeholder="World Rules / Political System"
></textarea>

<button
class="btn gold-btn"
style="width:100%;margin-top:10px;"
id="saveWorld">

Save World

</button>

</div>

</div>

<script>

/* CURRENT PROJECT */

const currentProject =
JSON.parse(
localStorage.getItem("current-project")
);

/* STORAGE KEY */

const storageKey =
"worlds-" + currentProject.name;

/* STORAGE */

let worlds =
JSON.parse(
localStorage.getItem(storageKey)
) || [];

let deletedWorld = null;

let editingIndex = null;

/* ELEMENTS */

const modal =
document.getElementById("modal");

const openModal =
document.getElementById("openModal");

const saveWorld =
document.getElementById("saveWorld");

const worldGrid =
document.getElementById("worldGrid");

/* OPEN */

openModal.onclick = ()=>{

modal.style.display = "flex";

};

/* CLOSE */

window.onclick = (e)=>{

if(e.target === modal){

modal.style.display = "none";

}

};

/* SAVE STORAGE */

function saveStorage(){

localStorage.setItem(
storageKey,
JSON.stringify(worlds)
);

}

/* RENDER */

function renderWorlds(){

worldGrid.innerHTML = "";

worlds.forEach((world,index)=>{

const card =
document.createElement("div");

card.classList.add("world-card");

card.innerHTML = `

<div class="card-actions">

<button class="action-btn edit-btn">
✎
</button>

<button class="action-btn delete-btn">
✕
</button>

</div>

<h2>${world.name}</h2>

<p>

Type: ${world.type}<br><br>

Timeline:
${world.timeline}<br><br>

Culture:
${world.culture}<br><br>

Architecture:
${world.architecture}<br><br>

Fashion:
${world.fashion}<br><br>

Technology:
${world.technology}<br><br>

Weather:
${world.weather}<br><br>

Palette:
${world.palette}

</p>

<span class="world-tag">
${world.type}
</span>

`;

/* DELETE */

card.querySelector(".delete-btn")
.onclick = ()=>{

deletedWorld = world;

worlds.splice(index,1);

saveStorage();

renderWorlds();

};

/* EDIT */

card.querySelector(".edit-btn")
.onclick = ()=>{

editingIndex = index;

document.getElementById("worldName")
.value = world.name;

document.getElementById("worldType")
.value = world.type;

document.getElementById("worldTimeline")
.value = world.timeline;

document.getElementById("worldCulture")
.value = world.culture;

document.getElementById("worldArchitecture")
.value = world.architecture;

document.getElementById("worldFashion")
.value = world.fashion;

document.getElementById("worldTechnology")
.value = world.technology;

document.getElementById("worldWeather")
.value = world.weather;

document.getElementById("worldPalette")
.value = world.palette;

document.getElementById("worldEnvironment")
.value = world.environment;

document.getElementById("worldRules")
.value = world.rules;

modal.style.display = "flex";

};

worldGrid.appendChild(card);

});

}

/* INITIAL */

renderWorlds();

/* SAVE */

saveWorld.onclick = ()=>{

const name =
document.getElementById("worldName")
.value.trim();

const type =
document.getElementById("worldType")
.value;

const timeline =
document.getElementById("worldTimeline")
.value;

const culture =
document.getElementById("worldCulture")
.value;

const architecture =
document.getElementById("worldArchitecture")
.value;

const fashion =
document.getElementById("worldFashion")
.value;

const technology =
document.getElementById("worldTechnology")
.value;

const weather =
document.getElementById("worldWeather")
.value;

const palette =
document.getElementById("worldPalette")
.value;

const environment =
document.getElementById("worldEnvironment")
.value;

const rules =
document.getElementById("worldRules")
.value;

/* VALIDATION */

if(name === ""){

alert("Enter world name");

return;

}

/* DUPLICATE */

const duplicate =
worlds.some((world,i)=>

world.name.toLowerCase()
=== name.toLowerCase()

&& i !== editingIndex

);

if(duplicate){

alert(
"World already exists"
);

return;

}

/* OBJECT */

const newWorld = {

name,
type,
timeline,
culture,
architecture,
fashion,
technology,
weather,
palette,
environment,
rules

};

/* EDIT */

if(editingIndex !== null){

worlds[editingIndex] =
newWorld;

editingIndex = null;

}

/* NEW */

else{

worlds.push(newWorld);

}

/* SAVE */

saveStorage();

renderWorlds();

/* RESET */

document.getElementById("worldName").value = "";
document.getElementById("worldTimeline").value = "";
document.getElementById("worldCulture").value = "";
document.getElementById("worldArchitecture").value = "";
document.getElementById("worldFashion").value = "";
document.getElementById("worldTechnology").value = "";
document.getElementById("worldWeather").value = "";
document.getElementById("worldPalette").value = "";
document.getElementById("worldEnvironment").value = "";
document.getElementById("worldRules").value = "";

modal.style.display = "none";

};

/* UNDO */

document.getElementById("undoBtn")
.onclick = ()=>{

if(deletedWorld){

worlds.push(deletedWorld);

saveStorage();

renderWorlds();

deletedWorld = null;

}

};

/* BACK */

function goBack(){

window.location.href =
"project.html";

}

</script>

</body>

</html>
