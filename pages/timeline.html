<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins;
background:#050505;
color:white;
padding:30px;
margin:0;
}
.container{
max-width:1400px;
margin:auto;
}
.grid{
display:grid;
grid-template-columns:400px 1fr;
gap:25px;
}
.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid rgba(212,175,55,.15);
}
input,textarea{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
}
textarea{
height:120px;
}
button{
padding:14px 18px;
background:#d4af37;
border:none;
border-radius:14px;
cursor:pointer;
}
.event-box{
background:#1a1a1a;
padding:20px;
border-radius:18px;
margin-bottom:16px;
}
</style>
</head>
<body>

<div class="container">

<h1 style="color:#d4af37;">Timeline Engine</h1>

<div class="grid">

<div class="card">
<input id="eventTitle" placeholder="Event Title">
<input id="year" placeholder="Year / Era">
<textarea id="eventDesc" placeholder="Event Description"></textarea>

<button onclick="saveTimeline()">Save Event</button>
</div>

<div class="card">
<div id="timelineList"></div>
</div>

</div>
</div>

<script>

let events =
JSON.parse(localStorage.getItem("timeline")) || [];

function saveTimeline(){

events.push({
title:eventTitle.value,
year:year.value,
desc:eventDesc.value
});

localStorage.setItem(
"timeline",
JSON.stringify(events)
);

renderTimeline();
}

function renderTimeline(){

timelineList.innerHTML="";

events.forEach(event=>{

timelineList.innerHTML+=`
<div class="event-box">
<h3 style="color:#d4af37;">${event.title}</h3>
<p>${event.year}</p>
<p>${event.desc}</p>
</div>
`;

});
}

renderTimeline();

</script>

<script src="../js/app.js"></script>

</body>
</html>
