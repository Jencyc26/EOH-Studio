<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins;
background:#050505;
color:white;
padding:30px;
margin:0;
}

.container{
max-width:1500px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid rgba(212,175,55,.15);
}

input,select,textarea{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
font-family:Poppins;
}

textarea{
height:90px;
resize:none;
}

button{
padding:14px 18px;
background:#d4af37;
border:none;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

.character-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:18px;
}

.character-box{
background:#1a1a1a;
padding:22px;
border-radius:20px;
}

.avatar{
width:95px;
height:95px;
border-radius:50%;
background:#d4af37;
margin:auto;
margin-bottom:16px;
}

.role{
display:inline-block;
padding:6px 12px;
background:#222;
color:#d4af37;
border-radius:20px;
font-size:12px;
margin-bottom:12px;
}

.detail{
font-size:13px;
color:#bbb;
margin-top:6px;
}
</style>
</head>
<body>

<div class="container">

<h1 style="color:#d4af37;">Character Engine</h1>

<div class="grid">

<div class="card">

<input id="name" placeholder="Character Name">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height">
<input id="nation" placeholder="Nationality">
<input id="eye" placeholder="Eye Color">
<input id="hair" placeholder="Hair Color">

<select id="role">
<option>Main Character</option>
<option>Supporting Character</option>
<option>NPC</option>
</select>

<textarea id="behavior" placeholder="Behavior"></textarea>
<textarea id="emotion" placeholder="Emotional Patterns"></textarea>

<input id="scars" placeholder="Scars">
<input id="moles" placeholder="Moles">

<button onclick="saveCharacter()">
Save Character
</button>

</div>

<div class="card">

<div id="characterList" class="character-grid"></div>

</div>

</div>

</div>

<script>

let characters =
JSON.parse(localStorage.getItem("characters")) || [];

function saveCharacter(){

const char={

name:name.value,
age:age.value,
height:height.value,
nation:nation.value,
eye:eye.value,
hair:hair.value,
role:role.value,
behavior:behavior.value,
emotion:emotion.value,
scars:scars.value,
moles:moles.value

};

characters.push(char);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

renderCharacters();

}

function renderCharacters(){

characterList.innerHTML="";

characters.forEach(char=>{

characterList.innerHTML += `

<div class="character-box">

<div class="avatar"></div>

<center>
<div class="role">${char.role}</div>
<h3 style="color:#d4af37;">${char.name}</h3>
</center>

<div class="detail">Age: ${char.age}</div>
<div class="detail">Height: ${char.height}</div>
<div class="detail">Nationality: ${char.nation}</div>
<div class="detail">Eyes: ${char.eye}</div>
<div class="detail">Hair: ${char.hair}</div>
<div class="detail">Behavior: ${char.behavior}</div>
<div class="detail">Emotion: ${char.emotion}</div>
<div class="detail">Scars: ${char.scars}</div>
<div class="detail">Moles: ${char.moles}</div>

</div>

`;

});

}

renderCharacters();

</script>

<script src="../js/app.js"></script>

</body>
</html>
