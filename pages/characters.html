<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH Character Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
padding:35px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
color:#d4af37;
margin-bottom:12px;
}

.subtitle{
color:#888;
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:420px 1fr;
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:22px;
border:1px solid rgba(212,175,55,0.15);
}

input,select,textarea{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
font-family:'Poppins',sans-serif;
}

textarea{
height:120px;
resize:none;
}

button{
padding:14px 18px;
border:none;
border-radius:14px;
cursor:pointer;
background:linear-gradient(145deg,#d4af37,#f1cc56);
color:black;
font-weight:600;
}

.character-list{
display:grid;
gap:18px;
}

.character-box{
background:#1a1a1a;
padding:18px;
border-radius:16px;
}

.name{
color:#d4af37;
font-size:20px;
margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container">

<button onclick="goBack()">← Workspace</button>

<h1>👤 Character Engine</h1>
<p class="subtitle">
Build persistent characters for continuity-aware storytelling.
</p>

<div class="grid">

<div class="card">

<input id="name" placeholder="Character Name">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height">
<input id="eye" placeholder="Eye Color">
<input id="hair" placeholder="Hair Color">
<input id="nation" placeholder="Nationality">

<select id="role">
<option>Main Character</option>
<option>Sub Character</option>
<option>NPC</option>
</select>

<textarea id="behavior" placeholder="Behavior / quirks"></textarea>

<input id="scars" placeholder="Scars (optional)">
<input id="moles" placeholder="Moles (optional)">

<button onclick="saveCharacter()">
Save Character
</button>

</div>

<div class="card">

<div id="characterList" class="character-list"></div>

</div>

</div>

</div>

<script>

function goBack(){
window.location.href="project.html";
}

let characters =
JSON.parse(localStorage.getItem("characters")) || [];

function saveCharacter(){

const character = {
name:document.getElementById("name").value,
age:document.getElementById("age").value,
height:document.getElementById("height").value,
eye:document.getElementById("eye").value,
hair:document.getElementById("hair").value,
nation:document.getElementById("nation").value,
role:document.getElementById("role").value,
behavior:document.getElementById("behavior").value,
scars:document.getElementById("scars").value,
moles:document.getElementById("moles").value
};

characters.push(character);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

renderCharacters();

}

function renderCharacters(){

const list =
document.getElementById("characterList");

list.innerHTML = "";

characters.forEach(character=>{

list.innerHTML += `
<div class="character-box">
<div class="name">${character.name}</div>
<p>${character.role}</p>
<p>${character.nation}</p>
<p>${character.behavior}</p>
</div>
`;

});

}

renderCharacters();

</script>

<script src="../js/app.js"></script>

</body>
</html>
