<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins;
background:#050505;
color:white;
padding:30px;
}

.container{
max-width:1400px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid rgba(212,175,55,.15);
}

input,select,textarea{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
}

button{
padding:14px 18px;
background:#d4af37;
border:none;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

.character-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:18px;
}

.character-box{
background:#1a1a1a;
padding:20px;
border-radius:18px;
text-align:center;
position:relative;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
background:#d4af37;
margin:auto;
margin-bottom:15px;
}

.role{
display:inline-block;
padding:6px 12px;
border-radius:20px;
background:#222;
color:#d4af37;
font-size:12px;
margin-bottom:10px;
}

.actions{
margin-top:15px;
display:flex;
gap:8px;
justify-content:center;
}
</style>
</head>

<body>

<div class="container">

<h1 style="color:#d4af37;">Character Engine</h1>

<div class="grid">

<div class="card">

<input id="name" placeholder="Character Name">
<input id="nation" placeholder="Nationality">
<input id="eye" placeholder="Eye Color">
<input id="hair" placeholder="Hair Color">

<select id="role">
<option>Main Character</option>
<option>Supporting Role</option>
<option>NPC</option>
</select>

<textarea id="behavior" placeholder="Behavior"></textarea>

<input type="file" id="charImage">

<button onclick="saveCharacter()">
Save Character
</button>

</div>

<div class="card">
<div id="characterList" class="character-grid"></div>
</div>

</div>

</div>

<script>

let characters =
JSON.parse(localStorage.getItem("characters")) || [];

function saveCharacter(){

const char = {
name:name.value,
nation:nation.value,
eye:eye.value,
hair:hair.value,
role:role.value,
behavior:behavior.value
};

characters.push(char);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

renderCharacters();
}

function deleteCharacter(i){

characters.splice(i,1);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

renderCharacters();
}

function renderCharacters(){

const list =
document.getElementById("characterList");

list.innerHTML="";

characters.forEach((char,i)=>{

list.innerHTML += `
<div class="character-box">

<div class="avatar"></div>

<div class="role">${char.role}</div>

<h3 style="color:#d4af37;">
${char.name}
</h3>

<p>${char.nation}</p>

<p style="font-size:13px;color:#888;">
${char.behavior}
</p>

<div class="actions">
<button onclick="deleteCharacter(${i})">Delete</button>
</div>

</div>
`;

});
}

renderCharacters();

</script>

<script src="../js/app.js"></script>

</body>
</html>
