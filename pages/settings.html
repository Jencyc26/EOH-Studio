<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
padding:35px;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
color:#d4af37;
margin-bottom:12px;
font-size:38px;
}

.subtitle{
color:#888;
margin-bottom:40px;
}

.settings-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:22px;
border:1px solid rgba(212,175,55,0.15);
}

.card h2{
color:#d4af37;
margin-bottom:18px;
font-size:22px;
}

label{
display:block;
margin-bottom:10px;
color:#aaa;
font-size:14px;
}

select,input{
width:100%;
padding:14px;
margin-bottom:18px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
font-family:'Poppins',sans-serif;
}

button{
padding:15px 20px;
border:none;
border-radius:14px;
cursor:pointer;
background:linear-gradient(145deg,#d4af37,#f1cc56);
color:black;
font-weight:600;
}

.back-btn{
margin-bottom:30px;
background:#151515;
color:#d4af37;
border:1px solid rgba(212,175,55,0.2);
}

</style>
</head>

<body>

<div class="container">

<button class="back-btn" onclick="goBack()">
← Workspace
</button>

<h1>⚙ EOH Settings</h1>

<p class="subtitle">
Configure language, visual defaults and generation behavior.
</p>

<div class="settings-grid">

<div class="card">
<h2>Language</h2>

<label>Primary Language</label>
<select id="language">
<option>English</option>
<option>Tamil</option>
<option>English + Tamil</option>
</select>

</div>

<div class="card">
<h2>Visual Defaults</h2>

<label>Default Frame</label>
<select id="frame">
<option>16:9</option>
<option>1:1</option>
<option>9:16</option>
</select>

<label>Theme</label>
<select id="theme">
<option>Gold & Black</option>
<option>Dark Silver</option>
</select>

</div>

<div class="card">
<h2>Generator Quality</h2>

<label>Default Quality</label>
<select id="quality">
<option>Ultra</option>
<option>High</option>
<option>Medium</option>
</select>

</div>

<div class="card">
<h2>Save</h2>

<button onclick="saveSettings()">
Save Settings
</button>

</div>

</div>

</div>

<script>

function goBack(){
window.location.href="project.html";
}

function saveSettings(){

const settings = {
language:document.getElementById("language").value,
frame:document.getElementById("frame").value,
theme:document.getElementById("theme").value,
quality:document.getElementById("quality").value
};

localStorage.setItem(
"eoh-settings",
JSON.stringify(settings)
);

alert("Settings Saved");
}

</script>

<script src="../js/app.js"></script>

</body>
</html>
