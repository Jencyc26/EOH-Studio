<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EOH Asset Engine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
}

/* MAIN */

.container{
padding:35px;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
flex-wrap:wrap;
gap:15px;
}

.title h1{
font-size:38px;
color:#d4af37;
margin-bottom:8px;
}

.title p{
color:#888;
}

/* BUTTONS */

.button-group{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.btn{
padding:14px 20px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.gold-btn{
background:linear-gradient(145deg,#d4af37,#f1cc56);
color:black;
}

.dark-btn{
background:#151515;
color:#d4af37;
border:1px solid rgba(212,175,55,0.2);
}

.btn:hover{
transform:translateY(-3px);
}

/* GRID */

.asset-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:24px;
}

/* CARD */

.asset-card{
background:#111;
padding:20px;
border-radius:22px;
border:1px solid rgba(212,175,55,0.15);
position:relative;
transition:0.3s;
overflow:hidden;
}

.asset-card:hover{
transform:translateY(-5px);
border-color:#d4af37;
}

.asset-preview{
width:100%;
height:220px;
object-fit:cover;
border-radius:16px;
margin-bottom:18px;
background:#1a1a1a;
}

.asset-card h2{
color:#d4af37;
margin-bottom:10px;
font-size:22px;
}

.asset-card p{
color:#999;
line-height:1.7;
font-size:14px;
}

/* TAG */

.asset-tag{
display:inline-block;
margin-top:14px;
padding:8px 14px;
border-radius:30px;
background:#1b1b1b;
color:#d4af37;
font-size:12px;
}

/* ACTIONS */

.card-actions{
position:absolute;
top:18px;
right:18px;
display:flex;
gap:8px;
}

.action-btn{
border:none;
padding:8px 10px;
border-radius:10px;
cursor:pointer;
}

.delete-btn{
background:#2a0000;
color:#ff7070;
}

.edit-btn{
background:#111827;
color:#7dd3fc;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-box{
width:650px;
max-height:90vh;
overflow-y:auto;
background:#111;
padding:30px;
border-radius:24px;
border:1px solid rgba(212,175,55,0.2);
}

.modal-box h2{
color:#d4af37;
margin-bottom:20px;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
width:100%;
padding:14px;
margin-bottom:14px;
border:none;
border-radius:12px;
background:#1b1b1b;
color:white;
font-family:'Poppins',sans-serif;
}

textarea{
resize:none;
height:100px;
}

/* FOOTER */

.footer{
margin-top:50px;
text-align:center;
color:#666;
font-size:13px;
}

@media(max-width:700px){

.container{
padding:20px;
}

.modal-box{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<!-- TOPBAR -->

<div class="topbar">

<div class="title">

<h1>
🖼 Asset Engine
</h1>

<p>
Store references, environments and continuity assets
</p>

</div>

<div class="button-group">

<button class="btn dark-btn"
onclick="goBack()">

← Workspace

</button>

<button class="btn dark-btn"
id="undoBtn">

↩ Undo Delete

</button>

<button class="btn gold-btn"
id="openModal">

+ Add Asset

</button>

</div>

</div>

<!-- GRID -->

<section class="asset-grid"
id="assetGrid">

</section>

<div class="footer">
EOH Asset Engine © 2026
</div>

</div>

<!-- MODAL -->

<div class="modal"
id="modal">

<div class="modal-box">

<h2>Add Asset</h2>

<input
type="text"
id="assetName"
placeholder="Asset Name"
>

<select id="assetType">

<option>Background</option>
<option>Village</option>
<option>Flag</option>
<option>Costume</option>
<option>Environment</option>
<option>Reference</option>
<option>Room</option>
<option>Building</option>

</select>

<textarea
id="assetDescription"
placeholder="Asset Description"
></textarea>

<input
type="file"
id="assetImage"
accept="image/*"
>

<button
class="btn gold-btn"
style="width:100%;margin-top:10px;"
id="saveAsset">

Save Asset

</button>

</div>

</div>

<script>

/* CURRENT PROJECT */

const currentProject =
JSON.parse(
localStorage.getItem("current-project")
);

/* STORAGE KEY */

const storageKey =
"assets-" + currentProject.name;

/* STORAGE */

let assets =
JSON.parse(
localStorage.getItem(storageKey)
) || [];

let deletedAsset = null;

let editingIndex = null;

/* ELEMENTS */

const modal =
document.getElementById("modal");

const openModal =
document.getElementById("openModal");

const saveAsset =
document.getElementById("saveAsset");

const assetGrid =
document.getElementById("assetGrid");

/* OPEN */

openModal.onclick = ()=>{

modal.style.display = "flex";

};

/* CLOSE */

window.onclick = (e)=>{

if(e.target === modal){

modal.style.display = "none";

}

};

/* SAVE STORAGE */

function saveStorage(){

localStorage.setItem(
storageKey,
JSON.stringify(assets)
);

}

/* RENDER */

function renderAssets(){

assetGrid.innerHTML = "";

assets.forEach((asset,index)=>{

const card =
document.createElement("div");

card.classList.add("asset-card");

card.innerHTML = `

<div class="card-actions">

<button class="action-btn edit-btn">
✎
</button>

<button class="action-btn delete-btn">
✕
</button>

</div>

<img
src="${asset.image}"
class="asset-preview"
>

<h2>${asset.name}</h2>

<p>

Type:
${asset.type}<br><br>

${asset.description}

</p>

<span class="asset-tag">
${asset.type}
</span>

`;

/* DELETE */

card.querySelector(".delete-btn")
.onclick = ()=>{

deletedAsset = asset;

assets.splice(index,1);

saveStorage();

renderAssets();

};

/* EDIT */

card.querySelector(".edit-btn")
.onclick = ()=>{

editingIndex = index;

document.getElementById("assetName")
.value = asset.name;

document.getElementById("assetType")
.value = asset.type;

document.getElementById("assetDescription")
.value = asset.description;

modal.style.display = "flex";

};

assetGrid.appendChild(card);

});

}

/* INITIAL */

renderAssets();

/* SAVE */

saveAsset.onclick = ()=>{

const name =
document.getElementById("assetName")
.value.trim();

const type =
document.getElementById("assetType")
.value;

const description =
document.getElementById("assetDescription")
.value;

const imageInput =
document.getElementById("assetImage");

if(name === ""){

alert("Enter asset name");

return;

}

/* DUPLICATE */

const duplicate =
assets.some((asset,i)=>

asset.name.toLowerCase()
=== name.toLowerCase()

&& i !== editingIndex

);

if(duplicate){

alert(
"Asset already exists"
);

return;

}

/* IMAGE */

const file =
imageInput.files[0];

if(file){

const reader =
new FileReader();

reader.onload = function(e){

saveAssetData(
e.target.result
);

};

reader.readAsDataURL(file);

}

else{

saveAssetData("");

}

function saveAssetData(imageData){

const newAsset = {

name,
type,
description,
image:imageData

};

/* EDIT */

if(editingIndex !== null){

assets[editingIndex] =
newAsset;

editingIndex = null;

}

/* NEW */

else{

assets.push(newAsset);

}

/* SAVE */

saveStorage();

renderAssets();

/* RESET */

document.getElementById("assetName").value = "";
document.getElementById("assetDescription").value = "";
document.getElementById("assetImage").value = "";

modal.style.display = "none";

}

};

/* UNDO */

document.getElementById("undoBtn")
.onclick = ()=>{

if(deletedAsset){

assets.push(deletedAsset);

saveStorage();

renderAssets();

deletedAsset = null;

}

};

/* BACK */

function goBack(){

window.location.href =
"project.html";

}

</script>

</body>

</html>
