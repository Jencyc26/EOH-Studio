<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH Story Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#050505;
color:white;
padding:30px;
margin:0;
}

.container{
max-width:1450px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:400px 1fr;
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:24px;
border:1px solid rgba(212,175,55,.15);
}

input,textarea,select{
width:100%;
padding:14px;
margin-bottom:14px;
background:#1a1a1a;
border:none;
border-radius:14px;
color:white;
font-family:Poppins;
}

textarea{
height:220px;
resize:none;
}

button{
padding:14px 18px;
background:#d4af37;
border:none;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

.story-list{
display:grid;
gap:18px;
}

.story-box{
background:#1a1a1a;
padding:20px;
border-radius:18px;
}

.actions{
margin-top:14px;
display:flex;
gap:10px;
}

h1{
color:#d4af37;
margin-bottom:20px;
}

.mode-tag{
display:inline-block;
padding:6px 12px;
background:#222;
color:#d4af37;
border-radius:20px;
font-size:12px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>📖 Story Engine</h1>

<div class="grid">

<!-- LEFT -->

<div class="card">

<input id="title" placeholder="Story Part / Chapter">

<select id="mode">
<option>Story Mode</option>
<option>Screenplay Mode</option>
<option>Scene Breakdown</option>
<option>Notes Mode</option>
</select>

<textarea id="storyContent" placeholder="Write your story here..."></textarea>

<input id="sceneTag" placeholder="Scene Tag (Optional)">

<button onclick="saveStory()">
Save Story
</button>

</div>

<!-- RIGHT -->

<div class="card">

<div id="storyList" class="story-list"></div>

</div>

</div>

</div>

<script>

let stories =
JSON.parse(localStorage.getItem("stories")) || [];

/* SAVE */

function saveStory(){

const story = {

title:title.value,
mode:mode.value,
content:storyContent.value,
sceneTag:sceneTag.value

};

stories.push(story);

localStorage.setItem(
"stories",
JSON.stringify(stories)
);

renderStories();

}

/* DELETE */

function deleteStory(i){

stories.splice(i,1);

localStorage.setItem(
"stories",
JSON.stringify(stories)
);

renderStories();

}

/* RENDER */

function renderStories(){

const list =
document.getElementById("storyList");

list.innerHTML="";

stories.forEach((story,i)=>{

list.innerHTML += `

<div class="story-box">

<div class="mode-tag">
${story.mode}
</div>

<h3 style="color:#d4af37;">
${story.title}
</h3>

<p style="
margin-top:12px;
color:#aaa;
line-height:1.7;
">
${story.content.substring(0,250)}...
</p>

<p style="
margin-top:12px;
font-size:13px;
color:#777;
">
${story.sceneTag}
</p>

<div class="actions">

<button onclick="deleteStory(${i})">
Delete
</button>

</div>

</div>

`;

});

}

renderStories();

</script>

<script src="../js/app.js"></script>

</body>
</html>
