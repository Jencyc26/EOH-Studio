<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EOH Studio - Project Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow:hidden;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-bottom:1px solid rgba(212,175,55,0.2);
}

.header h1{
color:#d4af37;
font-size:22px;
}

.back-btn{
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
padding:10px 14px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

/* LAYOUT */
.container{
display:grid;
grid-template-columns:300px 1fr;
height:calc(100vh - 70px);
}

/* SIDEBAR */
.sidebar{
background:#0d0d0d;
padding:15px;
border-right:1px solid rgba(212,175,55,0.15);
overflow:auto;
}

.tab{
padding:12px;
margin-bottom:10px;
background:#111;
border-radius:10px;
cursor:pointer;
border:1px solid rgba(212,175,55,0.1);
}

.tab:hover{
border-color:#d4af37;
}

/* MAIN */
.main{
padding:20px;
overflow:auto;
}

/* BOX */
.box{
background:#111;
padding:15px;
border-radius:12px;
margin-bottom:15px;
border:1px solid rgba(212,175,55,0.15);
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
background:#0a0a0a;
border:none;
color:white;
border-radius:8px;
}

button{
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
padding:10px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

/* CHARACTER CARD */
.char{
background:#0a0a0a;
padding:10px;
border-radius:8px;
margin-top:8px;
border:1px solid rgba(212,175,55,0.1);
}

.small{
font-size:12px;
color:#aaa;
}

</style>

</head>

<body>

<div class="header">

<h1 id="projectName">Project</h1>

<button class="back-btn" onclick="goBack()">Back</button>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="tab" onclick="show('world')">🌍 World</div>
<div class="tab" onclick="show('story')">📖 Story</div>
<div class="tab" onclick="show('characters')">🧍 Characters</div>

</div>

<!-- MAIN -->
<div class="main">

<!-- WORLD -->
<div id="world" class="section">

<div class="box">

<h3>World Engine / உலகம்</h3>

<input id="country" placeholder="Country">

<input id="culture" placeholder="Culture">

<select id="type">
<option>Fictional</option>
<option>Non-Fictional</option>
<option>Sci-Fi</option>
</select>

<textarea id="worldDesc" placeholder="World Description"></textarea>

<button onclick="save()">Save World</button>

</div>

</div>

<!-- STORY -->
<div id="story" class="section" style="display:none">

<div class="box">

<h3>Story Engine / கதை</h3>

<textarea id="storyText" placeholder="Write story..."></textarea>

<button onclick="save()">Save Story</button>

</div>

</div>

<!-- CHARACTERS -->
<div id="characters" class="section" style="display:none">

<div class="box">

<h3>Character Engine / கதாபாத்திரம்</h3>

<input id="charName" placeholder="Name">
<input id="charAge" placeholder="Age">
<input id="charTrait" placeholder="Personality trait">

<button onclick="addChar()">Add Character</button>

<div id="charList"></div>

</div>

</div>

</div>

</div>

<script>

/* LOAD PROJECT */
let project = JSON.parse(localStorage.getItem("current_project"));

if(!project){
alert("No project found");
window.location.href="../index.html";
}

project.worldData = project.worldData || {};
project.characters = project.characters || [];
project.story = project.story || "";

/* TITLE */
document.getElementById("projectName").innerText = project.name;

/* SECTION SWITCH */
function show(id){

document.querySelectorAll(".section").forEach(s=>{
s.style.display="none";
});

document.getElementById(id).style.display="block";

}

/* BACK */
function goBack(){
window.location.href="../index.html";
}

/* SAVE WORLD + STORY */
function save(){

project.worldData = {
country: document.getElementById("country").value,
culture: document.getElementById("culture").value,
type: document.getElementById("type").value,
description: document.getElementById("worldDesc").value
};

project.story = document.getElementById("storyText").value;

updateStorage();

alert("Saved!");

}

/* ADD CHARACTER */
function addChar(){

let name = document.getElementById("charName").value;
let age = document.getElementById("charAge").value;
let trait = document.getElementById("charTrait").value;

if(!name) return;

project.characters.push({
name,
age,
trait
});

document.getElementById("charName").value="";
document.getElementById("charAge").value="";
document.getElementById("charTrait").value="";

renderChars();

updateStorage();

}

/* RENDER CHARACTERS */
function renderChars(){

let list = document.getElementById("charList");
list.innerHTML="";

project.characters.forEach(c=>{

let div = document.createElement("div");
div.className="char";
div.innerHTML = `
<b>${c.name}</b><br>
<span class="small">${c.age} / ${c.trait}</span>
`;

list.appendChild(div);

});

}

/* UPDATE STORAGE */
function updateStorage(){

let all = JSON.parse(localStorage.getItem("eoh_projects")) || [];

let index = all.findIndex(p=>p.id===project.id);

if(index !== -1){
all[index] = project;
}

localStorage.setItem("eoh_projects",JSON.stringify(all));
localStorage.setItem("current_project",JSON.stringify(project));

}

/* INIT */
renderChars();

</script>

</body>
</html>
