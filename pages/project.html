<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH Studio - Workspace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
overflow:hidden;
}

/* LAYOUT */
.container{
display:flex;
height:100vh;
}

/* LEFT PANEL */
.sidebar{
width:300px;
background:#0d0d0d;
border-right:1px solid rgba(212,175,55,0.2);
padding:20px;
display:flex;
flex-direction:column;
gap:20px;
}

.title{
color:#d4af37;
font-size:22px;
}

/* PROJECT INFO */
.info-box{
padding:15px;
background:#111;
border-radius:12px;
border:1px solid rgba(212,175,55,0.2);
}

.info-box p{
font-size:13px;
color:#aaa;
line-height:1.6;
}

/* BUTTON */
.btn{
background:linear-gradient(145deg,#d4af37,#f1cc56);
border:none;
padding:12px;
border-radius:10px;
font-weight:600;
cursor:pointer;
color:black;
}

/* MAIN AREA */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */
.header{
padding:20px;
border-bottom:1px solid rgba(212,175,55,0.15);
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
color:#d4af37;
}

/* WORK AREA */
.workspace{
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

/* EDITORS */
.panel{
background:#111;
border:1px solid rgba(212,175,55,0.15);
border-radius:12px;
padding:15px;
display:flex;
flex-direction:column;
}

.panel h3{
color:#d4af37;
margin-bottom:10px;
}

/* TEXTAREA */
textarea{
flex:1;
background:#0a0a0a;
border:none;
outline:none;
color:white;
padding:12px;
border-radius:10px;
resize:none;
font-size:14px;
line-height:1.5;
}

/* CHARACTER LIST */
.char-list{
display:flex;
flex-direction:column;
gap:10px;
margin-top:10px;
}

.char{
padding:10px;
background:#0a0a0a;
border-radius:8px;
border:1px solid rgba(212,175,55,0.1);
font-size:13px;
color:#ccc;
}

.small-input{
padding:10px;
background:#0a0a0a;
border:1px solid rgba(212,175,55,0.2);
border-radius:8px;
color:white;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="sidebar">

<h2 class="title">EOH Workspace</h2>

<div class="info-box">
<p id="projectInfo">Loading project...</p>
</div>

<button class="btn" onclick="saveProject()">Save Project</button>

<button class="btn" onclick="goBack()">← Back</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
<h2 id="projectName">Project</h2>
</div>

<div class="workspace">

<!-- STORY -->
<div class="panel">
<h3>Story Editor</h3>
<textarea id="storyBox" placeholder="Write your story..."></textarea>
</div>

<!-- CHARACTERS -->
<div class="panel">

<h3>Characters</h3>

<input class="small-input" id="charName" placeholder="Character Name">

<button class="btn" onclick="addCharacter()">Add Character</button>

<div class="char-list" id="charList"></div>

</div>

</div>

</div>

</div>

<script>

/* LOAD PROJECT */
let project = JSON.parse(localStorage.getItem("current-project"));

if(!project){
alert("No project found");
window.location.href = "../index.html";
}

/* INIT DEFAULT FIELDS */
project.story = project.story || "";
project.characters = project.characters || [];

/* UI ELEMENTS */
const storyBox = document.getElementById("storyBox");
const charList = document.getElementById("charList");

/* SET DATA */
document.getElementById("projectName").innerText = project.name;

document.getElementById("projectInfo").innerHTML =
`Style: ${project.style}<br>World: ${project.world}`;

storyBox.value = project.story;

/* RENDER CHARACTERS */
function renderChars(){

charList.innerHTML = "";

project.characters.forEach((c,index)=>{

const div = document.createElement("div");
div.className = "char";
div.innerText = c;

charList.appendChild(div);

});

}

/* ADD CHARACTER */
function addCharacter(){

const name = document.getElementById("charName").value;

if(!name) return;

project.characters.push(name);

document.getElementById("charName").value = "";

renderChars();

}

/* SAVE */
function saveProject(){

project.story = storyBox.value;

let all = JSON.parse(localStorage.getItem("eoh-projects")) || [];

let index = all.findIndex(p => p.name === project.name);

if(index !== -1){
all[index] = project;
}

localStorage.setItem("eoh-projects", JSON.stringify(all));
localStorage.setItem("current-project", JSON.stringify(project));

alert("Project Saved!");

}

/* BACK */
function goBack(){
window.location.href = "../index.html";
}

/* AUTO LOAD */
renderChars();

</script>

</body>
</html>
