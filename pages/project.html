<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOH Workspace</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="workspace-page">

<div class="workspace-header">
<h1 id="workspaceTitle">Project</h1>
<p>Cinematic continuity workspace</p>
</div>

<div class="workspace-grid">

<div class="workspace-card">
<h2>World Engine</h2>
<p>Create world logic and cultures.</p>
<button class="primary-btn">Open</button>
</div>

<div class="workspace-card">
<h2>Character Engine</h2>
<p>Store habits and emotions.</p>
<button class="primary-btn">Open</button>
</div>

<div class="workspace-card">
<h2>Story Engine</h2>
<p>Write scripts and timelines.</p>
<button class="primary-btn">Open</button>
</div>

<div class="workspace-card">
<h2>Visual Generator</h2>
<p>Generate cinematic visuals.</p>
<button class="primary-btn">Open</button>
</div>

</div>

</div>

<script>
const project = JSON.parse(localStorage.getItem("current-project"));

if(project){
document.getElementById("workspaceTitle").innerText = project.name;
}
</script>

</body>
</html>
